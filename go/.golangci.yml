    # staticcheck の設定
    staticcheck:
      # 有効化するチェック（デフォルトですべて有効）
      checks: ["all", "-ST1003"] # ST1003: パッケージ名のアンダースコア警告を除外（ディレクトリ構造に由来）

# フォーマッター固有の設定（v2形式）
formatters:
  # 有効化するフォーマッター
  enable:
    - gofmt # Go標準フォーマッター
    - goimports # import文の整理

  # フォーマッター除外パス
  exclusions:
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*
      - '(.+)_templ\.go' # templ 自動生成ファイル

  settings:
    # goimports の設定
    goimports:
      # ローカルパッケージのプレフィックス
      local-prefixes:
        - github.com/mewstcom/mewst/go

# 出力設定（v2形式）
output:
  formats:
    text:
      path: stdout
      colors: true
