name: Go CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

env:
  GO_VERSION: "1.26.4"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check sqlc generate
        run: make sqlc-diff

      - name: Check templ generate
        run: |
          make templ-generate
          git diff --exit-code internal/templates/

      - name: Check goimports
        run: |
          make goimports-check

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # koryluslintの `comment` サブコマンドで、日本語テキストの表記を検査する。
      # 対象はコードコメントに限らない。`.go` / `.templ` はコメント、`.sh` / `.ts` はコメント・文字列・
      # ヒアドキュメント、`.sql` / `.css` / `.toml` は日本語を含む行全体を検査する。
      # 既存の違反はすべて直してあるため、差分に限らず全体を検査する。
      - name: Check Japanese text style
        run: make lint-style

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          working-directory: go
          args: --config=.golangci.yml ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/mewst_test?sslmode=disable
      MEWST_PORT: "4004"
      MEWST_DOMAIN: "test.example.com"
      MEWST_COOKIE_DOMAIN: ".test.example.com"
      MEWST_SESSION_SECURE: "false"
      MEWST_SESSION_HTTPONLY: "true"
      MEWST_RAILS_APP_URL: "http://localhost:3000"
      MEWST_DISABLE_RATE_LIMIT: "false"
      MEWST_TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      MEWST_RESEND_API_KEY: "re_test_key"
      MEWST_RESEND_FROM_EMAIL: "test@example.com"

    services:
      postgresql:
        image: postgres:18.3
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mewst_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: |
          go mod download

      - name: Setup test database
        run: |
          make db-setup-test

      - name: Run tests
        env:
          CI: true
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/mewst ]; then
            echo "Build failed: binary not found"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: go/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: make test-js

      - name: Type-check frontend
        run: make typecheck-js
