name: Rails CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "rails/**"
      # The RSpec job builds its test database from the Go-owned schema.
      # [Ja] RSpec ジョブは Go 側が管理するスキーマからテスト用データベースを構築する
      - "go/db/schema.sql"
      - ".github/workflows/rails-ci.yml"
  pull_request:
    paths:
      - "rails/**"
      - "go/db/schema.sql"
      - ".github/workflows/rails-ci.yml"

jobs:
  zeitwerk:
    name: Zeitwerk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: rails
      - run: bin/rails zeitwerk:check

  standard:
    name: Standard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: rails
      - run: bin/standardrb

  erb_lint:
    name: ERB Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: rails
      - run: bin/erb_lint --lint-all

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.1
          package-manager-cache: false
      - name: Install Yarn
        run: |
          npm install --global yarn@1.22.19
      - name: Install npm packages
        run: |
          yarn install
      - name: ESLint check
        run: |
          yarn eslint .

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/mewst_test
      RAILS_ENV: test
    services:
      postgresql:
        image: postgres:18.3
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: mewst_test
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.1
          package-manager-cache: false
      - name: Install Yarn
        run: |
          npm install --global yarn@1.22.19
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
      - run: chrome --version
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: rails
      # The schema is owned by the Go side, so the test database is built from
      # go/db/schema.sql.
      #
      # [Ja] スキーマは Go 側が管理するため、テスト用データベースは
      # go/db/schema.sql から構築する。
      - name: Setup Database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../go/db/schema.sql
      - name: Precompile assets
        run: |
          bin/rails assets:precompile
      - run: bin/rspec
      - name: Upload Capybara screenshot
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots
          path: "rails/**/tmp/capybara/"
