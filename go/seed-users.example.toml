# `mewst seed` が作成する開発用アカウントの名簿。実際に使う名簿は個人の
# メールアドレスを持つためバージョン管理には入れず、代わりに本ファイルをコミットして
# いる。シードを使えるようにするには、本ファイルを .gitignoreが除外している
# go/seed-users.tomlへコピーし、アドレスを自分がメールを読めるものへ置き換える。
#
# localeにはアプリケーションが提供する言語 ("ja" か "en") を、time_zoneにはIANAの
# タイムゾーン名を書く。エクスポートのHTMLは、文言・日時表記・月境界をこの2つから
# 出し分ける。feature_flagsには、アプリケーションが定義するフラグを全件与える文字列
# "all" か、["go_example"] のようなフラグ名の配列のどちらかを書く。それぞれの役割が
# 何のためにあるのかは、生成器がそれを名指ししているinternal/seed/role.goに書いてある。

# passwordは以下のすべてのアカウントで共通。シードは開発環境以外での実行を
# 拒否し、devサイト自体もBasic認証の内側にあるため、アカウントごとに別の
# パスワードを持たせても得るものが無い。
password = "password"

[[users]]
role = "main"
atname = "seeduser1"
name = "シードユーザー1"
email = "seeduser1@example.com"
note = "主な確認対象。3年分のポストを持ち、エクスポートの確認とmake browse-loginの既定アカウント"
locale = "ja"
time_zone = "Asia/Tokyo"
feature_flags = "all"

[[users]]
role = "follower"
atname = "seeduser2"
name = "シードユーザー2"
email = "seeduser2@example.com"
note = "mainと相互フォロー。フィーチャーフラグ未付与時の画面をmainと見比べる"
locale = "ja"
time_zone = "Asia/Tokyo"
feature_flags = []

[[users]]
role = "english"
atname = "seeduser3"
name = "シードユーザー3"
email = "seeduser3@example.com"
note = "エクスポートHTMLのlocaleと月境界の出し分けをmainと見比べる"
locale = "en"
time_zone = "Etc/UTC"
feature_flags = "all"

[[users]]
role = "newcomer"
atname = "seeduser4"
name = "シードユーザー4"
email = "seeduser4@example.com"
note = "ポスト0件。空のエクスポートと、サインアップ直後の画面"
locale = "ja"
time_zone = "Asia/Tokyo"
feature_flags = "all"

[[users]]
role = "discarded"
atname = "seeduser5"
name = "シードユーザー5"
email = "seeduser5@example.com"
note = "削除済みプロフィール。作者が削除されたポストの見え方 (サインインはできない)"
locale = "ja"
time_zone = "Asia/Tokyo"
feature_flags = []
