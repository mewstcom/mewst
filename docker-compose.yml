services:
  go-app:
    build:
      context: ./go
      dockerfile: ./Dockerfile.dev
    depends_on:
      - caddy
      - postgresql
    volumes:
      - .:/workspace
      - op-config:/home/developer/.config/op
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/.cache/go-build
    ports:
      - "4100:8080"
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}

  rails-app:
    build:
      context: ./rails
      dockerfile: ./Dockerfile.dev
    depends_on:
      - go-app
    volumes:
      - .:/workspace
      - op-config:/home/developer/.config/op
      - app_gems_data:/usr/local/bundle
    environment:
      - BINDING=0.0.0.0
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}
    ports:
      - "4101:3000"
    stdin_open: true
    tty: true
    working_dir: /workspace

  caddy:
    image: caddy:2-alpine
    ports:
      - "4103:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  postgresql:
    image: postgres:16.2
    ports:
      - "4104:5432"
    volumes:
      - postgresql16_data:/var/lib/postgresql/data:delegated
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  chrome:
    image: browserless/chrome:1.61.1-chrome-stable
    ports:
      - "4105:3333"
    environment:
      PORT: 3333
      # デバッグ中にタイムアウトを起こさないようにするため時間を長くしておく
      # https://docs.browserless.io/docs/docker.html#connection-timeout
      CONNECTION_TIMEOUT: 600000

volumes:
  op-config:
  app_gems_data:
  go-build-cache:
  go-mod-cache:
  postgresql16_data:
